# CI: プルリクエスト / push のたびにリンター (ESLint) を実行する
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

# 同じブランチで新しい実行が始まったら、古い実行はキャンセルする
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        # アプリ本体は src/ にある
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Dockerfile のベースイメージ (node:26) と揃える
          node-version: 26
          cache: npm
          cache-dependency-path: src/package-lock.json

      # package-lock.json の内容どおりにインストール
      - run: npm ci

      # リンター
      - run: npm run lint
